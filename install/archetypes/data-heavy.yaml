schema_version: 1
id: data-heavy
name: "Data-Heavy"
description: >
  Project archetype for data-pipeline / ML / analytics work where Phase 6
  Implementation involves notebook-driven exploration, dataset wrangling,
  and model experimentation rather than canonical app feature-build. Ports
  the MetaGPT Data Interpreter pattern as a Phase-6 subagent variant.
status: experimental
priority: 30

subagent_overrides:
  - phase: 6
    replace: developer
    replace_with: data-interpreter
    reason: >
      Implementation in data-heavy projects is notebook + dataset-wrangling
      shaped, not story-shaped. The data-interpreter variant carries
      pandas / polars / sklearn idioms in its persona and emits .ipynb
      artefacts under `_context/implementation/notebooks/` rather than
      story-batch code under `sandbox/`.
  - phase: 7
    replace: developer
    replace_with: data-interpreter
    reason: >
      Phase 7 deploy in data projects often means materialising a model
      to a serving endpoint or writing a scheduled pipeline — the same
      data-interpreter persona handles it.

skill_overrides:
  # Disable app-build-shaped skills that don't apply to data work.
  disable:
    - quick-dev   # quick UI-feature dev mode is irrelevant here
  # Future: enable data-specific skills (e.g. notebook-execute,
  # dataset-profile) once they ship under `skills/data/`.
  enable: []

template_overrides:
  - template: prd
    source: archetypes/data-heavy/prd.md
    reason: >
      Data PRDs lead with a Hypothesis section + Dataset section + Success
      Metrics section instead of the canonical Vision / Personas / Stories
      structure.

notes: |
  The `data-interpreter` subagent variant is NOT shipped in v1 —
  scaffolding it ships with the archetype-application logic when the
  CLI wiring lands. Until then this archetype validates structurally
  but `coldpress init --archetype data-heavy` will surface the missing
  variant clearly at apply time.
