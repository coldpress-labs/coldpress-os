# Wave Status Template — coldpress-os Orchestrator
#
# Tracks the real-time progress of wave execution.
# Updated by the wave-orchestration skill during Phase 6.

metadata:
  project: "{project-name}"
  dag_id: "{dag-id}"
  scope: "epics"
  generated: "{date}"
  last_updated: "{date}"

# Overall progress
summary:
  total_waves: 0
  completed_waves: 0
  current_wave: 1
  total_tasks: 0
  completed_tasks: 0
  progress_percent: 0

# Wave-by-wave tracking
waves:
  wave-1:
    status: "pending"                    # pending | active | completed
    tasks:
      task-1:
        name: "{Task Name}"
        status: "pending"                # pending | in-progress | done
        started_at: null
        completed_at: null
        agent: "{agent-slug}"
        notes: ""
    gate:
      criteria: "{Human-readable gate criteria}"
      status: "pending"                  # pending | approved | revision_requested | halted
      presented_at: null
      decided_at: null
      decided_by: null
      notes: ""

  wave-2:
    status: "pending"
    tasks:
      task-2:
        name: "{Task Name}"
        status: "pending"
        started_at: null
        completed_at: null
        agent: "{agent-slug}"
        notes: ""
      task-3:
        name: "{Task Name — parallel with task-2}"
        status: "pending"
        started_at: null
        completed_at: null
        agent: "{agent-slug}"
        notes: ""
    gate:
      criteria: "{Gate criteria}"
      status: "pending"
      presented_at: null
      decided_at: null
      decided_by: null
      notes: ""

# Add more waves as needed...
