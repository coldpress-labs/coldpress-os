name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + build + drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Vulnerability scan (npm audit)
        # Hard gate (D7 dep-hygiene, 2026-07-03): fails on moderate-or-higher
        # advisories. The D7 pass cleared 12 vulns (1 critical + 3 high + 8
        # moderate) → 1 low (esbuild dev-server, Windows-only, below the gate).
        # Run `npm audit` locally + `npm audit fix` to recover.
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint SKILL.md frontmatter
        # Every SKILL.md must have valid frontmatter: name + description, a valid
        # `agent:` (the post-§4.5 roster + Butler), and a valid `type`.
        run: npm run lint:frontmatter

      - name: Build CLI
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate phase gate.json files
        # All 11 lifecycle/N-*/gate.json files must have minimal valid shape.
        # To-do 3.6 — adds explicit gate validation to CI so a malformed gate
        # (missing schema_version, gate_id, or acceptance_checks array) blocks merge.
        # Full schema validation against schemas/phase-gate.schema.ts can be
        # added once the schema is converted to runtime-enforceable JSON Schema.
        run: |
          set -e
          for gate in lifecycle/*/gate.json; do
            echo "Validating $gate..."
            node --input-type=module -e "
              import fs from 'node:fs';
              const s = JSON.parse(fs.readFileSync('$gate', 'utf8'));
              if (!s.schema_version || !s.gate_id || !Array.isArray(s.acceptance_checks)) {
                console.error('::error file=$gate::missing schema_version / gate_id / acceptance_checks[]');
                process.exit(1);
              }
            "
          done
          echo "All 11 phase gate.json files valid."

      - name: Check drift (generated artifacts vs source)
        # Regenerates every derived artifact (plugin/ today; registries + docs
        # as §8 item 11 lands) and fails if the result differs from what is
        # committed. Run `npm run check:drift` locally and commit the output to
        # fix. Supersedes the separate build:skills + `git diff plugin/` steps.
        run: npm run check:drift

  wiring:
    name: Wiring manifest (every cross-phase artifact has a producer)
    # WS10-G: the highest-leverage recurrence-preventer. The system-integration
    # audit found a whole class of breaks — consumers built + unit-tested against
    # fixtures, producers missing — that survived three review passes and 1000
    # green tests. This asserts data/wiring.yaml's invariant so that class can't
    # recur silently: every consumed cross-phase artifact has a producer, every
    # producer/consumer path resolves, every referenced schema exists.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build CLI
        run: npm run build
      - name: coldpress wiring check
        run: node dist/cli.js wiring check

  pack-smoke:
    name: Packaging smoke (pack → prod-install → init → plugin bootstrap)
    # Audit F3: restores the pre-overhaul packaging smoke — the check that caught
    # both v0.3.x production-only packaging bugs. Now load-bearing because
    # distribution is the plugin. `npm pack` the real tarball, install it
    # PRODUCTION-ONLY into a throwaway project, `coldpress init`, and assert the
    # plugin actually bootstraps. A runtime import of a devDependency or a file
    # missing from `files[]` fails here, not in a user's `npm i -g`.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Pack + clean-install + init smoke
        run: npm run smoke:pack

  evals:
    name: Evals runner (built CLI × shipped golden corpus)
    # Audit F3: `coldpress evals` existed but CI never ran it. This exercises the
    # BUILT dist/cli.js against the shipped `evals/` corpus end-to-end — catching
    # a broken evals CLI, a build-wiring regression, or a corpus that fails to
    # parse (the corpus's schema validity is separately covered by `npm test`).
    # Pass/fail of the golden tasks is workspace-dependent (they assert a live
    # project's _context artefacts), so the gate is "the runner scored every
    # task", not "every task passed".
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build CLI
        run: npm run build
      - name: Run the evals CLI over the shipped corpus
        run: |
          # Exit 1 is expected here (tasks assert a live project's artefacts,
          # absent in the framework repo) — capture output and gate on the
          # RUNNER having scored EVERY shipped task, not on pass/fail.
          node dist/cli.js evals --dir evals --json > evals-out.json || true
          # Self-adjusting floor (WS10-E4): the guard is "scored every shipped
          # eval file", derived from the corpus on disk — not a magic number
          # with zero margin. Catches a broken runner (n<total) AND silent
          # corpus shrinkage, and never needs bumping when tasks are added.
          EVAL_FILES=$(find evals -name '*.yaml' | wc -l | tr -d ' ')
          EXPECTED="$EVAL_FILES" node --input-type=module -e "
            import fs from 'node:fs';
            const expected = Number(process.env.EXPECTED);
            const r = JSON.parse(fs.readFileSync('evals-out.json','utf8'));
            const n = r.results?.length ?? 0;
            if (expected < 8) { console.error('::error::only '+expected+' eval files on disk — the golden corpus shrank below its floor'); process.exit(1); }
            if (n !== expected) { console.error('::error::evals CLI scored '+n+' tasks but '+expected+' eval files exist (broken runner or discovery bug?)'); process.exit(1); }
            for (const t of r.results) {
              if (!Array.isArray(t.checks) || t.checks.length === 0) {
                console.error('::error::eval task '+t.task_id+' produced no check results — the runner did not execute it'); process.exit(1);
              }
            }
            console.log('✓ evals CLI scored all '+n+' shipped tasks ('+r.passed+' pass / '+r.failed+' fail vs the framework repo — pass/fail is workspace-dependent).');
          "
