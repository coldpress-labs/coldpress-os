# coldpress.yaml — Project Configuration (framework reference copy)
#
# This is the example-shape of the file scaffolded into consumer
# projects by `coldpress init`. The canonical source is
# `template/coldpress.yaml`. Both are kept in sync.
#
# Phase-1 fields (below) are filled at project init — by the user or
# the `project-init` workflow. All other fields are written by their
# owning phase as the lifecycle progresses; the framework writes back
# to this file as each phase completes. See docs/coldpress-yaml-schema.md
# for the full schema and per-field phase ownership.

# ─── Project Identity ──────────────────────────────────────────────
project:
  name: ""                          # e.g., "My Project"
  slug: ""                          # e.g., "my-project" (kebab-case)

# ─── User ──────────────────────────────────────────────────────────
user:
  name: ""                          # e.g., "Aastha"
  communication_language: "English"
  document_output_language: "English"
