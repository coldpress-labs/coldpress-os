name: vibe-coder-fullstack
archetype_fits:
  product_types:
    - fullstack-web-app
    - saas-product
    - consumer-product
  domain_complexity:
    - low
    - medium
  functional_profile:
    - realtime
    - auth-heavy
    - database-backed
    - client-side-rich
pre_picked:
  frontend: "Next.js"
  backend: "Convex"
  auth: "Clerk"
  hosting: "Vercel"
  styling: "Tailwind"
  package_manager: "pnpm"
  source_control: "GitHub-private"
# Test architecture seeded into the project's testing.yaml — L0-L7 shape (audit F6).
testing:
  layers:
    L0: { tools: ["tsc"] }         # static
    L1: { tools: ["vitest"] }      # unit
    L4: { tools: ["playwright"] }  # e2e
overrideable: true
baselines_out_of_box:
  - accessibility
  - security
quickstart_skill: "skills/stack-packs/vibe-coder-fullstack/quickstart"
