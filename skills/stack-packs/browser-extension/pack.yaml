name: browser-extension
archetype_fits:
  product_types: ["browser-extension", "devtools-extension", "productivity-tool"]
  domain_complexity: ["low", "medium"]
  functional_profile: ["client-side-rich", "storage-backed", "api-consuming"]
pre_picked:
  framework: "WXT"
  manifest_version: "v3"
  styling: "Tailwind"
  package_manager: "pnpm"
  source_control: "GitHub-private"
  targets: "Chrome, Firefox"
# Test architecture seeded into the project's testing.yaml — L0-L7 shape (audit F6).
testing:
  layers:
    L0: { tools: ["tsc"] }      # static
    L1: { tools: ["vitest"] }   # unit
overrideable: true
baselines_out_of_box:
  - security
  - future_proof
quickstart_skill: "skills/stack-packs/browser-extension/quickstart"
